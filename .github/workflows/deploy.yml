name: Verify and deploy Node app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified Node release to production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:node
      - run: bash -n scripts/deploy-node.sh scripts/deploy-node-remote.sh
      - run: npm test
      - name: Build production app
        if: github.event_name != 'pull_request'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://deepskills.pk
          NEXT_PUBLIC_BUSINESS_PHONE: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          npm run build
      - name: Package source without secrets or PHP
        if: github.event_name != 'pull_request'
        run: npm run package:cpanel
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: node-source-${{ github.sha }}
          path: deepskills-cpanel-node.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deepskills-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: deepskills.pk
      DEPLOY_USER: deepskills.pk_244uyeu33k9
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
      DEPLOY_NODE_BIN: ${{ vars.DEPLOY_NODE_BIN }}
      DEPLOY_HEALTH_URL: https://deepskills.pk/api/health/
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: node-source-${{ github.sha }}
      - name: Deploy over verified SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/deploy-node.sh
